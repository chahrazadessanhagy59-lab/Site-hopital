    <div class="formulaire">
    <div class="container">
        <h1>Prise de Rendez-vous à l'Hôpital</h1>
        <form action="#" method="post" class="form">
          <label for="name">Nom complet</label>
          <input type="text" id="name" name="name" required>
    
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
    
          <label for="phone">Téléphone</label>
          <input type="tel" id="phone" name="phone" required>
    
          <label for="department">Service souhaité</label>
          <select id="department" name="department" required>
            <option value="general">Médecine générale</option>
            <option value="cardiology">Cardiologie</option>
            <option value="pediatrics">Pédiatrie</option>
            <option value="orthopedics">Orthopédie</option>
            <option> Autre</option>
          </select>
    
          <label for="date">Date du rendez-vous</label>
          <input type="date" id="date" name="date" required>
    
          <label for="time">Heure du rendez-vous</label>
          <input type="time" id="time" name="time" required>
        
          <button type="submit">Prendre rendez-vous</button>
        </form>
      </div>
    </div>
